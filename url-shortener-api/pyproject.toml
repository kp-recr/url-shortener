[project]
name = "url-shortener-api"
version = "0.1.0"
description = "URL shortener mini DRF project"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "djangorestframework~=3.18.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
    "black ~= 26.1.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]